services:
  - type: web
    name: titan-juggernaut-bot
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python TITAN_UNIFIED_BOT.py
    healthCheckPath: /ping
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: '3.11.11'
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: 'hirechehhireche-commits/Final-bot'
      - key: GITHUB_BRANCH
        value: 'main'
      - key: TITAN_PRIVATE
        value: '1'
      - key: TITAN_GATE_DAYS
        value: '4'
      - key: PORT
        value: '8080'
